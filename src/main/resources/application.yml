server:
    servlet:
        context-path: /cadastro-saude/api
spring:
    datasource:
        url: jdbc:h2:mem:cadastro-saude
        driver-class-name: org.h2.Driver
        username: admin
        password:
    h2:
        console:
            enabled: true
            path: /h2-console
jpa:
    hibernate:
         ddl-auto: update
         database-platform: org.hibernate.dialect.H2Dialect
    swagger:
        springdoc:
            api-docs:
                path: /cadastro-saude/api/v3/api-docs
            swagger-ui:
                path: /cadastro-saude/api/swagger-ui.html
